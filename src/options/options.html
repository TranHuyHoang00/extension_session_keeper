<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Session Keeper – Cài đặt</title>
  <link rel="stylesheet" href="../ui.css" />
</head>
<body class="options">
  <h1>Session Keeper – Cài đặt</h1>
  <p class="hint">
    Cách dùng: mở website cần giữ phiên, bấm icon extension và chọn <b>Gắn vào tab này</b>.
    Extension chỉ làm việc với đúng tab đó: trước khi token hết hạn, nó reload tab để website
    tự làm mới token. Extension không tự gọi API, không lưu giá trị token và không mở tab mới.
  </p>

  <form id="form">
    <label>
      Tên cookie chứa access token (JWT)
      <input id="tokenCookie" type="text" placeholder="access_token" required />
      <small>Xem trong DevTools → Application → Cookies của website.</small>
    </label>

    <label>
      Làm mới trước khi hết hạn (giây)
      <input id="marginSec" type="number" min="60" max="86400" step="30" required />
    </label>

    <label class="row">
      <input id="enabled" type="checkbox" />
      Bật tự động giữ phiên
    </label>

    <div class="actions">
      <button type="submit">Lưu</button>
      <button type="button" id="check" class="secondary">Kiểm tra cookie</button>
    </div>
  </form>

  <p id="bound" class="hint"></p>
  <p id="result" class="message"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
