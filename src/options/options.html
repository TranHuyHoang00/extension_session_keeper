<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Session Keeper – Cài đặt</title>
  <link rel="stylesheet" href="../ui.css" />
</head>
<body class="options">
  <h1>Session Keeper – Cài đặt</h1>
  <p class="hint">
    Extension không tự gọi API và không lưu giá trị token. Nó chỉ đọc thời điểm hết hạn,
    rồi reload một tab của website trước khi token hết hạn để website tự làm mới.
  </p>

  <form id="form">
    <label>
      Địa chỉ website
      <input id="siteUrl" type="url" placeholder="https://app.congty.vn" required />
      <small>Chỉ cần phần gốc (https + tên miền). Extension chỉ xin quyền cho đúng địa chỉ này.</small>
    </label>

    <label>
      Tên cookie chứa access token (JWT)
      <input id="tokenCookie" type="text" placeholder="access_token" required />
      <small>Xem trong DevTools → Application → Cookies.</small>
    </label>

    <label>
      Làm mới trước khi hết hạn (giây)
      <input id="marginSec" type="number" min="60" max="3600" step="30" required />
    </label>

    <label class="row">
      <input id="enabled" type="checkbox" />
      Bật tự động giữ phiên
    </label>

    <div class="actions">
      <button type="submit">Lưu</button>
      <button type="button" id="check" class="secondary">Kiểm tra cookie</button>
    </div>
  </form>

  <p id="result" class="message"></p>

  <script type="module" src="options.js"></script>
</body>
</html>
